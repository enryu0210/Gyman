# Gyman — Codemagic CI 설정 (iOS/TestFlight 베타 배포)
#
# 왜 CI 가 필요한가: .ipa 빌드·서명은 Xcode(macOS 전용)를 요구한다.
# 개발 환경이 Windows 라 로컬에서는 iOS 빌드를 아예 시도할 수 없다.
# 배경·블로커·결정 사항은 docs/ios_beta_plan.md.
#
# ─────────────────────────────────────────────────────────────────────────
# 워크플로가 둘인 이유 — "빌드가 되느냐"와 "기기에 올리느냐"는 요구 조건이 다르다.
#
#   ios-validate    애플 계정 불필요. 서명 없이 컴파일만 한다.
#                   → Windows 에서 원천적으로 확인 불가능한 것들(CocoaPods 해석,
#                     플러그인 iOS 호환, Podfile 최소버전 적합성, Info.plist)을 검증.
#                   Codemagic 가입 + 리포 연결만 하면 **오늘 바로** 돌릴 수 있다.
#
#   ios-testflight  Apple Developer Program($99/년) 필수. 서명 + TestFlight 업로드.
#                   Codemagic 웹 UI 에서 아래를 먼저 만들어야 한다:
#                     1) 환경변수 그룹 `gyman_env`
#                        — SUPABASE_URL / SUPABASE_ANON_KEY / OAUTH_REDIRECT_URL
#                          (SUPABASE_ANON_KEY 는 secure 로 등록. anon 키라 클라 노출
#                           전제이긴 하나 습관을 지킨다)
#                     2) 환경변수 그룹 `appstore`
#                        — App Store Connect API 키 연동 (Teams > Integrations)
#                     3) 코드사인 — 계정 승인이 끝나야 인증서·프로비저닝이 발급된다
#
# 순서: ios-validate 를 먼저 통과시켜 배선 오류를 걷어낸 뒤 ios-testflight 로 간다.
# 그래야 첫 TestFlight 빌드가 깨졌을 때 원인이 "배선"인지 "서명"인지 갈린다.
#
# ── 경로 주의 ────────────────────────────────────────────────────────────
# Flutter 프로젝트는 리포 루트가 아니라 **src/app** 아래에 있다.
# 그래서 Codemagic 앱 설정의 "project path" 도 `src/app` 으로 잡아야
# 리포 연결 단계에서 "mobile application 을 못 찾았다"가 나지 않는다.
#
# 다만 그 설정에 따라 스크립트의 **시작 디렉터리가 달라질 수 있다.**
# 클론 루트에서 시작하면 `cd src/app` 이 맞고, 이미 src/app 에서 시작하면
# 같은 명령이 `src/app/src/app` 으로 이중화된다.
# 그래서 상대 경로를 쓰지 않고 **저장소 루트를 매번 구해서** 이동한다:
#     cd "$(git rev-parse --show-toplevel)/src/app"
# 이러면 어디서 시작하든 같은 곳에 선다. (CLAUDE.md 의 경로 단정 금지 규칙과 같은 이유)
# 아티팩트 경로도 같은 이유로 `**/` 글롭을 쓴다.
# ─────────────────────────────────────────────────────────────────────────

workflows:
  # ═══════════════════════════════════════════════════════════════════
  # 애플 계정 없이 도는 검증 빌드
  # ═══════════════════════════════════════════════════════════════════
  ios-validate:
    name: iOS 빌드 검증 (서명 없음 - 애플 계정 불필요)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: 3.44.0
      xcode: latest
      cocoapods: default

    scripts:
      # 컴파일만 확인하는 빌드라 Supabase 실제 값이 필요 없다.
      # pubspec 이 .env 를 에셋으로 선언하므로 "파일이 존재하기만" 하면 된다.
      # → 환경변수 그룹을 안 만들어도 이 워크플로는 돈다(설정 0).
      - name: .env 자리 채우기 (더미)
        script: |
          cd "$(git rev-parse --show-toplevel)/src/app"
          cp .env.example .env
          echo ".env 를 .env.example 로 채움 — 컴파일 검증 전용, 실제 접속 안 함"

      - name: 의존성 설치
        script: |
          cd "$(git rev-parse --show-toplevel)/src/app"
          flutter pub get

      - name: 정적 분석 + 단위 테스트
        script: |
          cd "$(git rev-parse --show-toplevel)/src/app"
          flutter analyze
          flutter test

      # 여기가 이 워크플로의 핵심. Windows 에서는 실행 자체가 불가능한 구간이다.
      - name: CocoaPods 해석
        script: |
          cd "$(git rev-parse --show-toplevel)/src/app/ios"
          pod install
          echo "--- 생성된 Podfile.lock (이 내용을 리포에 커밋할 것) ---"
          cat Podfile.lock

      - name: iOS 컴파일 (서명 없음)
        script: |
          cd "$(git rev-parse --show-toplevel)/src/app"
          flutter build ios --release --no-codesign

    artifacts:
      # Podfile.lock 은 재현 가능한 빌드에 필요하므로 받아서 커밋할 것.
      - "**/ios/Podfile.lock"
      - /tmp/xcodebuild_logs/*.log

  # ═══════════════════════════════════════════════════════════════════
  # 배포 빌드 — Apple Developer Program 승인 후에만 동작
  # ═══════════════════════════════════════════════════════════════════
  ios-testflight:
    name: iOS TestFlight (internal testers)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - gyman_env      # SUPABASE_URL, SUPABASE_ANON_KEY, OAUTH_REDIRECT_URL
        - appstore       # APP_STORE_CONNECT_* (Codemagic Integrations 에서 생성)
      flutter: 3.44.0    # pubspec 의 sdk 제약과 맞춤. 올릴 땐 로컬 검증 먼저.
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.gyman.gyman"

    scripts:
      # ── .env 복원 ────────────────────────────────────────────────────
      # pubspec.yaml 이 `.env` 를 에셋으로 선언하는데 그 파일은 .gitignore 대상이라
      # CI 체크아웃에는 존재하지 않는다. 없으면 flutter build 가 에셋 누락으로 실패하므로
      # 환경변수에서 다시 만들어 준다. (로그에 값이 찍히지 않도록 heredoc 사용)
      - name: .env 생성
        script: |
          cd "$(git rev-parse --show-toplevel)/src/app"
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          OAUTH_REDIRECT_URL=$OAUTH_REDIRECT_URL
          EOF
          # 값은 찍지 않고 채워졌는지만 확인한다.
          test -s .env && echo ".env 생성됨 ($(wc -l < .env)줄)"

      - name: 의존성 설치
        script: |
          cd "$(git rev-parse --show-toplevel)/src/app"
          flutter pub get

      # 로컬(Windows)에서도 도는 검증. iOS 빌드가 깨졌을 때
      # "코드 문제"인지 "iOS 배선 문제"인지 가르는 기준선이 된다.
      - name: 정적 분석 + 단위 테스트
        script: |
          cd "$(git rev-parse --show-toplevel)/src/app"
          flutter analyze
          flutter test

      - name: CocoaPods 설치
        script: |
          cd "$(git rev-parse --show-toplevel)/src/app/ios"
          pod install

      - name: 코드사인 설정
        script: |
          # App Store Connect API 키로 프로비저닝 프로파일을 받아 키체인에 적용.
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: .ipa 빌드
        script: |
          cd "$(git rev-parse --show-toplevel)/src/app"
          # 빌드 번호는 TestFlight 에 이미 올라간 것보다 커야 한다.
          # pubspec 의 +1 을 그대로 쓰면 두 번째 업로드부터 거부되므로 CI 카운터를 쓴다.
          flutter build ipa --release \
            --build-number="$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0) + 1))" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - "**/build/ios/ipa/*.ipa"
      - /tmp/xcodebuild_logs/*.log
      - "**/outputs/**/mapping.txt"

    publishing:
      app_store_connect:
        auth: integration
        # 내부 테스터는 베타 심사 없이 즉시 배포된다(결정 2: 애플 로그인 보류의 전제).
        submit_to_testflight: true
        submit_to_app_store: false

      email:
        recipients:
          - enrue0210@gmail.com
        notify:
          success: true
          failure: true
