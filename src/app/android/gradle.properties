org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# --- 환경 특수 설정 -----------------------------------------------------------
# Kotlin incremental compilation 비활성화.
#
# Why: **pub cache와 프로젝트가 서로 다른 드라이브에 있으면** Kotlin compiler의
# RelocatableFileToPathConverter가 cross-drive 상대 경로 계산에서
# IllegalArgumentException을 던지며 빌드가 실패한다.
# (예: shared_preferences_android, url_launcher_android 빌드 시 발생)
# 첫 빌드 속도만 약간 느려지고 결과물에는 영향 없음.
#
# ⚠ 이건 **기기별 조건**이다. 드라이브 문자를 여기 적지 말 것 — 기기마다 다르다.
#    지금 내 기기가 해당되는지는 아래로 확인:
#      flutter pub cache dir     (pub cache 위치)
#      git rev-parse --show-toplevel   (프로젝트 위치)
#    둘의 드라이브가 같으면 이 줄을 지워 incremental을 다시 켜도 된다.
#    같은 드라이브로 맞추려면 PUB_CACHE 환경변수를 프로젝트와 같은 드라이브로 지정.
kotlin.incremental=false
