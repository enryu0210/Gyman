org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# --- 환경 특수 설정 -----------------------------------------------------------
# Kotlin incremental compilation 비활성화.
#
# Why: pub cache(C:\Users\...\Pub\Cache)와 프로젝트(F:\dev\Gyman)가 서로 다른
# 드라이브에 있으면, Kotlin compiler의 RelocatableFileToPathConverter가
# cross-drive 상대 경로 계산에서 IllegalArgumentException을 던지며 빌드 실패.
# (예: shared_preferences_android, url_launcher_android 빌드 시 발생)
# 첫 빌드 속도만 약간 느려지고 결과물에는 영향 없음.
# 향후 pub cache를 F: 드라이브로 옮기면 다시 켜도 됨 (PUB_CACHE=F:\pub-cache).
kotlin.incremental=false
